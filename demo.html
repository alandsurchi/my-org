<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Dashboard API Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading { @apply animate-pulse; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center text-gray-900 mb-8">
            🎯 Charity Dashboard API Demo
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <!-- API Status -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">API Status</h3>
                <div id="api-status" class="text-gray-600">Checking...</div>
            </div>
            
            <!-- News Count -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">News Articles</h3>
                <div id="news-count" class="text-2xl font-bold text-blue-600">-</div>
            </div>
            
            <!-- Projects Count -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">Projects</h3>
                <div id="projects-count" class="text-2xl font-bold text-green-600">-</div>
            </div>
            
            <!-- Gallery Count -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold mb-2">Gallery Photos</h3>
                <div id="gallery-count" class="text-2xl font-bold text-purple-600">-</div>
            </div>
        </div>

        <!-- Content Management Demo -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Create News -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold mb-4">📰 Create News Article</h2>
                <form id="news-form" class="space-y-4">
                    <input
                        type="text"
                        id="news-title"
                        placeholder="Article title"
                        class="w-full p-3 border rounded-lg"
                        required
                    />
                    <textarea
                        id="news-content"
                        placeholder="Article content"
                        rows="4"
                        class="w-full p-3 border rounded-lg"
                        required
                    ></textarea>
                    <input
                        type="file"
                        id="news-image"
                        accept="image/*"
                        class="w-full p-3 border rounded-lg"
                    />
                    <button
                        type="submit"
                        class="w-full bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600 transition-colors"
                    >
                        Create Article
                    </button>
                </form>
            </div>

            <!-- Create Project -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold mb-4">🚀 Create Project</h2>
                <form id="project-form" class="space-y-4">
                    <input
                        type="text"
                        id="project-title"
                        placeholder="Project title"
                        class="w-full p-3 border rounded-lg"
                        required
                    />
                    <textarea
                        id="project-description"
                        placeholder="Project description"
                        rows="4"
                        class="w-full p-3 border rounded-lg"
                        required
                    ></textarea>
                    <select id="project-status" class="w-full p-3 border rounded-lg">
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                        <option value="planned">Planned</option>
                        <option value="on-hold">On Hold</option>
                    </select>
                    <input
                        type="file"
                        id="project-image"
                        accept="image/*"
                        class="w-full p-3 border rounded-lg"
                    />
                    <button
                        type="submit"
                        class="w-full bg-green-500 text-white p-3 rounded-lg hover:bg-green-600 transition-colors"
                    >
                        Create Project
                    </button>
                </form>
            </div>
        </div>

        <!-- Content Display -->
        <div class="mt-8 space-y-8">
            <!-- News Display -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold mb-4">📰 Latest News</h2>
                <div id="news-list" class="space-y-4">
                    <div class="text-center text-gray-500">Loading...</div>
                </div>
            </div>

            <!-- Projects Display -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold mb-4">🚀 Projects</h2>
                <div id="projects-list" class="space-y-4">
                    <div class="text-center text-gray-500">Loading...</div>
                </div>
            </div>
        </div>

        <!-- Admin Login -->
        <div class="fixed bottom-4 right-4">
            <div class="bg-white rounded-lg shadow-lg p-4 max-w-sm">
                <h3 class="font-bold mb-2">🔐 Admin Login</h3>
                <div class="space-y-2 text-sm">
                    <div><strong>Email:</strong> admin@charity.org</div>
                    <div><strong>Password:</strong> admin123</div>
                    <button id="login-btn" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition-colors">
                        Login
                    </button>
                    <div id="login-status" class="text-center"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let authToken = localStorage.getItem('authToken');

        // Update auth headers
        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                ...(authToken && { 'Authorization': `Bearer ${authToken}` })
            };
        }

        // Check API status
        async function checkAPIStatus() {
            try {
                const response = await fetch('http://localhost:5000');
                const data = await response.json();
                document.getElementById('api-status').innerHTML = `
                    <div class="text-green-600 font-semibold">✅ Connected</div>
                    <div class="text-sm">${data.message}</div>
                `;
            } catch (error) {
                document.getElementById('api-status').innerHTML = `
                    <div class="text-red-600 font-semibold">❌ Disconnected</div>
                    <div class="text-sm">Backend not running</div>
                `;
            }
        }

        // Load data
        async function loadData() {
            try {
                // Load news
                const newsResponse = await fetch(`${API_BASE}/news`);
                const news = await newsResponse.json();
                document.getElementById('news-count').textContent = news.length;
                displayNews(news);

                // Load projects
                const projectsResponse = await fetch(`${API_BASE}/projects`);
                const projects = await projectsResponse.json();
                document.getElementById('projects-count').textContent = projects.length;
                displayProjects(projects);

                // Load gallery
                const galleryResponse = await fetch(`${API_BASE}/gallery`);
                const gallery = await galleryResponse.json();
                document.getElementById('gallery-count').textContent = gallery.length;
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Display news
        function displayNews(news) {
            const newsList = document.getElementById('news-list');
            if (news.length === 0) {
                newsList.innerHTML = '<div class="text-center text-gray-500">No news articles yet.</div>';
                return;
            }

            newsList.innerHTML = news.map(article => `
                <div class="border rounded-lg p-4">
                    <div class="flex gap-4">
                        ${article.imageUrl ? `
                            <img src="http://localhost:5000${article.imageUrl}" alt="${article.title}" 
                                 class="w-16 h-16 object-cover rounded" />
                        ` : ''}
                        <div class="flex-1">
                            <h3 class="font-semibold">${article.title}</h3>
                            <p class="text-gray-600 text-sm mt-1">${article.content.substring(0, 100)}...</p>
                            <p class="text-xs text-gray-500 mt-2">${new Date(article.createdAt).toLocaleDateString()}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Display projects
        function displayProjects(projects) {
            const projectsList = document.getElementById('projects-list');
            if (projects.length === 0) {
                projectsList.innerHTML = '<div class="text-center text-gray-500">No projects yet.</div>';
                return;
            }

            projectsList.innerHTML = projects.map(project => `
                <div class="border rounded-lg p-4">
                    <div class="flex gap-4">
                        ${project.imageUrl ? `
                            <img src="http://localhost:5000${project.imageUrl}" alt="${project.title}" 
                                 class="w-16 h-16 object-cover rounded" />
                        ` : ''}
                        <div class="flex-1">
                            <h3 class="font-semibold">${project.title}</h3>
                            <p class="text-gray-600 text-sm mt-1">${project.description.substring(0, 100)}...</p>
                            <span class="inline-block px-2 py-1 text-xs rounded-full mt-2 ${
                                project.status === 'active' ? 'bg-green-100 text-green-800' :
                                project.status === 'completed' ? 'bg-blue-100 text-blue-800' :
                                project.status === 'planned' ? 'bg-yellow-100 text-yellow-800' :
                                'bg-gray-100 text-gray-800'
                            }">${project.status}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Handle news form
        document.getElementById('news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!authToken) {
                alert('Please login first!');
                return;
            }

            const formData = new FormData();
            formData.append('title', document.getElementById('news-title').value);
            formData.append('content', document.getElementById('news-content').value);
            
            const imageFile = document.getElementById('news-image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                const response = await fetch(`${API_BASE}/news`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
                });

                if (response.ok) {
                    alert('News article created successfully!');
                    document.getElementById('news-form').reset();
                    loadData(); // Reload data
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.message);
                }
            } catch (error) {
                alert('Error creating news: ' + error.message);
            }
        });

        // Handle project form
        document.getElementById('project-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!authToken) {
                alert('Please login first!');
                return;
            }

            const formData = new FormData();
            formData.append('title', document.getElementById('project-title').value);
            formData.append('description', document.getElementById('project-description').value);
            formData.append('status', document.getElementById('project-status').value);
            
            const imageFile = document.getElementById('project-image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                const response = await fetch(`${API_BASE}/projects`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
                });

                if (response.ok) {
                    alert('Project created successfully!');
                    document.getElementById('project-form').reset();
                    loadData(); // Reload data
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.message);
                }
            } catch (error) {
                alert('Error creating project: ' + error.message);
            }
        });

        // Handle login
        document.getElementById('login-btn').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@charity.org',
                        password: 'admin123'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    document.getElementById('login-status').innerHTML = 
                        '<div class="text-green-600 text-xs">✅ Logged in as ' + data.user.email + '</div>';
                } else {
                    const error = await response.json();
                    document.getElementById('login-status').innerHTML = 
                        '<div class="text-red-600 text-xs">❌ ' + error.message + '</div>';
                }
            } catch (error) {
                document.getElementById('login-status').innerHTML = 
                    '<div class="text-red-600 text-xs">❌ Connection error</div>';
            }
        });

        // Check if already logged in
        if (authToken) {
            document.getElementById('login-status').innerHTML = 
                '<div class="text-green-600 text-xs">✅ Already logged in</div>';
        }

        // Initialize
        checkAPIStatus();
        loadData();
        setInterval(loadData, 30000); // Refresh every 30 seconds
    </script>
</body>
</html>
