<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete System Status - MROVDOSTAN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
        }
        .data-item {
            background: #f8f9fa;
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .preview-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .links {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        .links a {
            display: inline-block;
            background: #667eea;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: bold;
        }
        .links a:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Complete System Status - MROVDOSTAN</h1>

        <div class="links">
            <h2 style="color: #667eea; margin-bottom: 15px;">Quick Access Links</h2>
            <a href="http://localhost:8080" target="_blank">🏠 Main Website</a>
            <a href="http://localhost:8080/dashboard" target="_blank">📊 Dashboard</a>
            <a href="http://localhost:8080/staff-login" target="_blank">🔐 Staff Login</a>
            <a href="http://localhost:5000" target="_blank">🔧 Backend API</a>
            <button onclick="testAll()">🔄 Refresh All Data</button>
        </div>

        <div class="grid" id="statusGrid">
            <!-- Will be filled by JavaScript -->
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        
        async function testBackend() {
            const card = document.getElementById('backend-status');
            try {
                const response = await fetch(`${API_BASE}/`);
                const data = await response.json();
                card.innerHTML = `
                    <h2>🔧 Backend Server</h2>
                    <div class="status success">
                        <span>✅</span>
                        <div>
                            <strong>Status: Running</strong><br>
                            Version: ${data.version}<br>
                            Database: ${data.database}
                        </div>
                    </div>
                    <div class="data-item">
                        <strong>Available Endpoints:</strong><br>
                        ${data.endpoints.map(e => `• ${e}`).join('<br>')}
                    </div>
                `;
            } catch (error) {
                card.innerHTML = `
                    <h2>🔧 Backend Server</h2>
                    <div class="status error">
                        <span>❌</span>
                        <div><strong>Error:</strong> ${error.message}</div>
                    </div>
                `;
            }
        }

        async function testHero() {
            const card = document.getElementById('hero-status');
            try {
                const response = await fetch(`${API_BASE}/api/hero`);
                const data = await response.json();
                const imgUrl = data.url.startsWith('http') ? data.url : `${API_BASE}${data.url}`;
                card.innerHTML = `
                    <h2>🖼️ Hero Image</h2>
                    <div class="status success">
                        <span>✅</span>
                        <div><strong>Hero image loaded</strong></div>
                    </div>
                    <div class="data-item">
                        <strong>File:</strong> ${data.originalName}<br>
                        <strong>Size:</strong> ${(data.fileSize / 1024).toFixed(2)} KB<br>
                        <strong>Uploaded by:</strong> ${data.uploadedBy}
                    </div>
                    <img src="${imgUrl}" alt="Hero" style="width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px;">
                `;
            } catch (error) {
                card.innerHTML = `
                    <h2>🖼️ Hero Image</h2>
                    <div class="status error">
                        <span>❌</span>
                        <div><strong>Error:</strong> ${error.message}</div>
                    </div>
                `;
            }
        }

        async function testNews() {
            const card = document.getElementById('news-status');
            try {
                const response = await fetch(`${API_BASE}/api/news`);
                const data = await response.json();
                card.innerHTML = `
                    <h2>📰 News Articles</h2>
                    <div class="status success">
                        <span>✅</span>
                        <div><strong>${data.length} news articles loaded</strong></div>
                    </div>
                    ${data.slice(0, 5).map(item => `
                        <div class="data-item">
                            <strong>${item.title}</strong><br>
                            <small>${new Date(item.createdAt).toLocaleDateString()}</small><br>
                            <small>Category: ${item.category || 'None'}</small>
                        </div>
                    `).join('')}
                `;
            } catch (error) {
                card.innerHTML = `
                    <h2>📰 News Articles</h2>
                    <div class="status error">
                        <span>❌</span>
                        <div><strong>Error:</strong> ${error.message}</div>
                    </div>
                `;
            }
        }

        async function testProjects() {
            const card = document.getElementById('projects-status');
            try {
                const response = await fetch(`${API_BASE}/api/projects`);
                const data = await response.json();
                card.innerHTML = `
                    <h2>🚀 Projects</h2>
                    <div class="status success">
                        <span>✅</span>
                        <div><strong>${data.length} projects loaded</strong></div>
                    </div>
                    ${data.map(item => `
                        <div class="data-item">
                            <strong>${item.title}</strong><br>
                            <small>Status: ${item.status}</small><br>
                            <small>${new Date(item.createdAt).toLocaleDateString()}</small>
                        </div>
                    `).join('')}
                `;
            } catch (error) {
                card.innerHTML = `
                    <h2>🚀 Projects</h2>
                    <div class="status error">
                        <span>❌</span>
                        <div><strong>Error:</strong> ${error.message}</div>
                    </div>
                `;
            }
        }

        async function testGallery() {
            const card = document.getElementById('gallery-status');
            try {
                const response = await fetch(`${API_BASE}/api/gallery`);
                const data = await response.json();
                card.innerHTML = `
                    <h2>🖼️ Gallery</h2>
                    <div class="status success">
                        <span>✅</span>
                        <div><strong>${data.length} photos loaded</strong></div>
                    </div>
                    <div class="preview-grid">
                        ${data.slice(0, 6).map(item => {
                            const imgUrl = item.url.startsWith('http') ? item.url : `${API_BASE}${item.url}`;
                            return `<img src="${imgUrl}" alt="${item.title}" class="preview-img">`;
                        }).join('')}
                    </div>
                `;
            } catch (error) {
                card.innerHTML = `
                    <h2>🖼️ Gallery</h2>
                    <div class="status error">
                        <span>❌</span>
                        <div><strong>Error:</strong> ${error.message}</div>
                    </div>
                `;
            }
        }

        function initCards() {
            const grid = document.getElementById('statusGrid');
            grid.innerHTML = `
                <div class="card" id="backend-status"><div class="status loading">⏳ Loading...</div></div>
                <div class="card" id="hero-status"><div class="status loading">⏳ Loading...</div></div>
                <div class="card" id="news-status"><div class="status loading">⏳ Loading...</div></div>
                <div class="card" id="projects-status"><div class="status loading">⏳ Loading...</div></div>
                <div class="card" id="gallery-status"><div class="status loading">⏳ Loading...</div></div>
            `;
        }

        async function testAll() {
            initCards();
            await Promise.all([
                testBackend(),
                testHero(),
                testNews(),
                testProjects(),
                testGallery()
            ]);
        }

        // Auto-run on page load
        window.addEventListener('load', () => {
            initCards();
            setTimeout(testAll, 500);
        });
    </script>
</body>
</html>
