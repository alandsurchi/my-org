# Shared Railway config for services whose Root Directory is "/" (repo root):
#   - my-org  : the public web site  (Dockerfile)        -> serves "/"
#   - tests   : the test runner      (Dockerfile.tests, via RAILWAY_DOCKERFILE_PATH) -> serves "/" status page
# Build and start commands come from the Dockerfiles. The backend service uses backend/railway.toml.
[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
